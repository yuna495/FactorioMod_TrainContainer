[mod-setting-description]
train-container-max-chest-length=Maximum length of generated 1xN or Nx1 train containers. The maximum is 83, matching a 12-wagon train layout.
train-container-inventory-size-limit=Maximum inventory slots for generated train containers. The maximum is 3984, matching 83 steel chests.
train-container-allow-delete-items=Allows deleting items during merging or splitting of normal train containers.

