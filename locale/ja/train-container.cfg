[shortcut-name]
train-container-merge-chest-selector=列車コンテナを結合

[controls]
train-container-rotate-blueprint-clockwise=ブループリントを時計回りに回転
train-container-rotate-blueprint-counterclockwise=ブループリントを反時計回りに回転
train-container-merge-tool=列車コンテナ結合ツール

[controls-description]
train-container-rotate-blueprint-clockwise=列車コンテナを含むブループリントで動作します。
train-container-rotate-blueprint-counterclockwise=列車コンテナを含むブループリントで動作します。

[mod-setting-name]
train-container-max-chest-length=列車コンテナの最大長
train-container-inventory-size-limit=インベントリサイズ上限
train-container-circuit-connector-position=回路接続位置
train-container-allow-delete-items=アイテム消去を許可

[mod-setting-description]
train-container-max-chest-length=生成する 1xN または Nx1 の列車コンテナの最大長です。最大値は12両編成相当の83です。
train-container-inventory-size-limit=生成する列車コンテナのインベントリスロット上限です。最大値は鋼鉄製チェスト83個分の3984です。
train-container-allow-delete-items=通常列車コンテナの結合または分割時にアイテムを消去することを許可します。

[string-mod-setting]
train-container-circuit-connector-position-center-center=中心に最も近い位置
train-container-circuit-connector-position-right-top=右上
train-container-circuit-connector-position-right-middle=右中央
train-container-circuit-connector-position-right-bottom=右下
train-container-circuit-connector-position-left-top=左上
train-container-circuit-connector-position-left-middle=左中央
train-container-circuit-connector-position-left-bottom=左下
train-container-circuit-connector-position-bottom-right=下右
train-container-circuit-connector-position-bottom-middle=下中央
train-container-circuit-connector-position-bottom-left=下左

[flying-text]
train-container-items-would-be-deleted-merge=結合するとアイテムが失われます
train-container-items-would-be-deleted-split=分割するとアイテムが失われます
train-container-different-quality-chests=品質の異なるチェストは結合できません
train-container-infinity-split-disabled=無限列車コンテナはテスト専用のため分割できません。
train-container-infinity-requires-cheat-mode=無限列車コンテナにはエディターモードまたはチートモードが必要です。

[message]
train-container-cargoships-bridges-cleaned=列車コンテナと重なっている Cargo Ships の可動橋補助エンティティを __1__ 個削除しました。

[command-help]
train-container-clean-cargoships-bridges=列車コンテナと重なっている Cargo Ships の可動橋補助エンティティを削除します。壊れたエディタ配置やブループリント配置の掃除に一度だけ使ってください。
